name: Promote beta to prod

# Run from the Actions tab once beta (https://susparty.com/?beta=1) has passed its checks.
# 1. Plays the whole test suite against beta again, at the exact commit beta runs.
# 2. Waits for rounds real people are playing on prod to finish (a restart drops them).
# 3. Copies beta into prod, applies the Nginx config, restarts prod.
# 4. Plays games on prod. If anything fails, puts the previous prod build back.
# Player data (selfies, task lists, stats, logs) stays separate for each.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Restart prod even if people are in the middle of a round'
        type: boolean
        default: false

concurrency:
  group: droplet
  cancel-in-progress: false

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04, where the Playwright
# version in client/package.json can't install its browsers.
jobs:
  beta:
    name: Find the beta build
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show what will be promoted
        id: version
        run: |
          beta="$(curl -sf --cookie 'sus_channel=beta' https://susparty.com/api/version)"
          echo "Beta (promoting): $beta"
          echo "Prod (replacing): $(curl -s https://susparty.com/api/version)"
          commit="$(echo "$beta" | jq -r '.commit // empty')"
          if [ -z "$commit" ]; then
            echo "Beta didn't say which commit it runs, so its tests can't be matched to it." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The full commit, for checking out the tests that match beta's build
          echo "sha=$(git rev-parse --verify "$commit^{commit}")" >> "$GITHUB_OUTPUT"

  # Prod only gets a build that just played every test game on beta.
  socket-games:
    name: Server plays full games on beta (sockets)
    needs: beta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.beta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps
      - name: Play full games with 5 and 40 players
        working-directory: ./client
        run: |
          node scripts/e2e-live.js https://susparty.com --beta --browser --expect-commit "${{ needs.beta.outputs.commit }}"
          node scripts/e2e-live.js https://susparty.com --beta --players 40 --expect-commit "${{ needs.beta.outputs.commit }}"

  browser:
    name: Browser games on beta (${{ matrix.name }})
    needs: beta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Chromium 1/3', project: chromium, shard: '1/3' }
          - { name: 'Chromium 2/3', project: chromium, shard: '2/3' }
          - { name: 'Chromium 3/3', project: chromium, shard: '3/3' }
          - { name: 'Safari 1/2', project: webkit, shard: '1/2' }
          - { name: 'Safari 2/2', project: webkit, shard: '2/2' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.beta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps
      - name: Install the test browser
        working-directory: ./client
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Play games in real browsers on beta
        working-directory: ./client
        run: npx playwright test -c e2e --project ${{ matrix.project }} --shard ${{ matrix.shard }}
        env:
          E2E_BASE_URL: https://susparty.com
          E2E_BETA: '1'
          E2E_WEBKIT: ${{ matrix.project == 'webkit' && '1' || '' }}
      - name: List known bugs
        if: always()
        working-directory: ./client
        run: node scripts/e2e-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            client/e2e/report
            client/e2e/results
          if-no-files-found: ignore

  promote:
    name: Copy beta into prod, check it, roll back if it fails
    needs: [beta, socket-games, browser]
    runs-on: ubuntu-24.04
    env:
      BETA_COMMIT: ${{ needs.beta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.beta.outputs.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      # Games live in the server's memory, so a restart ends every round in progress. Wait up
      # to 20 minutes for real rounds to finish (test rooms don't count), unless forced.
      - name: Wait for rounds in progress on prod to finish
        if: ${{ !inputs.force }}
        run: |
          for minute in $(seq 0 20); do
            health="$(curl -sf https://susparty.com/health || echo '{}')"
            rounds="$(echo "$health" | jq -r '.rounds_running // 0')"
            rooms="$(echo "$health" | jq -r '.rooms_in_use // 0')"
            echo "$(date -u +%H:%M) prod: $rounds rounds running, $rooms rooms with people in them"
            if [ "$rounds" = "0" ]; then
              if [ "$rooms" != "0" ]; then echo "::warning::$rooms lobbies with people in them will need to reconnect after the restart"; fi
              exit 0
            fi
            [ "$minute" = 20 ] || sleep 60
          done
          echo "::error::People are still mid-round on prod after 20 minutes. Run again later, or tick 'force'."
          exit 1

      - name: Copy beta into prod, apply Nginx, restart
        id: copy
        run: |
          scp deploy/nginx-amogus.conf root@${{ secrets.DROPLET_IP }}:/opt/amogus-beta/nginx-amogus.conf
          ssh root@${{ secrets.DROPLET_IP }} 'bash -s' << 'EOF'
            set -e
            if [ ! -f /opt/amogus-beta/server/version.json ] || [ ! -f /opt/amogus-beta/client/build/index.html ]; then
              echo "Nothing on beta to promote yet. Push to main first." >&2
              exit 1
            fi
            excludes=(
              --exclude '__pycache__' --exclude '*.pyc' --exclude 'stats.json*'
              --exclude 'selfies/*' --exclude 'task_lists/*' --exclude 'data/*'
              --exclude 'logs/*' --exclude 'cert.pem' --exclude 'key.pem'
            )
            # Keep the current prod release (and Nginx config) to roll back to
            mkdir -p /opt/amogus-previous/server /opt/amogus-previous/client/build
            rsync -a --delete "${excludes[@]}" /opt/amogus/server/ /opt/amogus-previous/server/
            rsync -a --delete /opt/amogus/client/build/ /opt/amogus-previous/client/build/
            cp -p /etc/nginx/sites-available/amogus /opt/amogus-previous/nginx-amogus.conf

            rsync -a --delete "${excludes[@]}" /opt/amogus-beta/server/ /opt/amogus/server/
            rsync -a --delete /opt/amogus-beta/client/build/ /opt/amogus/client/build/
            if [ -d /opt/amogus-beta/deploy ]; then rsync -a /opt/amogus-beta/deploy/ /opt/amogus/deploy/; fi

            # Nginx is shared by prod and beta; a config that fails its test is not applied
            config=/etc/nginx/sites-available/amogus
            cp /opt/amogus-beta/nginx-amogus.conf "$config"
            if ! nginx -t; then
              cp -p /opt/amogus-previous/nginx-amogus.conf "$config"
              echo "The new Nginx config failed nginx -t" >&2
              exit 1
            fi
            systemctl reload nginx

            systemctl restart amogus
            sleep 3
            systemctl status amogus --no-pager || true
          EOF

      - name: Health check
        run: |
          sleep 5
          curl --fail --retry 5 --retry-delay 2 https://susparty.com/health
          echo
          version="$(curl -s https://susparty.com/api/version)"
          echo "Prod version: $version"
          [ "$(echo "$version" | jq -r .commit)" = "$BETA_COMMIT" ] || { echo "Prod isn't running $BETA_COMMIT" >&2; exit 1; }

      # The same games, played on prod itself. Test rooms are marked synthetic, so they stay out
      # of usage stats.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps
      - name: Play a full game on prod (sockets)
        working-directory: ./client
        run: node scripts/e2e-live.js https://susparty.com --browser --expect-commit "$BETA_COMMIT"
      - name: Install the test browser
        working-directory: ./client
        run: npx playwright install --with-deps chromium
      - name: Play a game and open every page on prod in a real browser
        working-directory: ./client
        run: npx playwright test -c e2e --project chromium full-game.spec.js site.spec.js
        env:
          E2E_BASE_URL: https://susparty.com

      - name: Check live crawl access and canonical URLs
        working-directory: ./client
        run: node scripts/check-seo.js https://susparty.com

      - name: Put the previous prod build back
        if: ${{ failure() && steps.copy.conclusion != 'skipped' }}
        run: |
          ssh root@${{ secrets.DROPLET_IP }} 'bash -s' << 'EOF'
            set -e
            excludes=(
              --exclude '__pycache__' --exclude '*.pyc' --exclude 'stats.json*'
              --exclude 'selfies/*' --exclude 'task_lists/*' --exclude 'data/*'
              --exclude 'logs/*' --exclude 'cert.pem' --exclude 'key.pem'
            )
            rsync -a --delete "${excludes[@]}" /opt/amogus-previous/server/ /opt/amogus/server/
            rsync -a --delete /opt/amogus-previous/client/build/ /opt/amogus/client/build/
            if [ -f /opt/amogus-previous/nginx-amogus.conf ]; then
              cp -p /opt/amogus-previous/nginx-amogus.conf /etc/nginx/sites-available/amogus
              nginx -t && systemctl reload nginx
            fi
            systemctl restart amogus
            sleep 3
            systemctl status amogus --no-pager || true
          EOF
          sleep 5
          echo "Prod rolled back to: $(curl -s https://susparty.com/api/version)"
          echo "::error::The promoted build failed its checks on prod, so the previous build was put back."

      - name: Keep the prod check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-check
          path: |
            client/e2e/report
            client/e2e/results
          if-no-files-found: ignore
