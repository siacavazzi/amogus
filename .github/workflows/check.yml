name: Check a change

# Runs on every pull request (and by hand from the Actions tab for a branch with no PR).
# Everything runs here in CI against a local server, so a change is tested before it's merged
# and before it reaches beta or prod. Branch pushes don't start it on their own: with a PR open
# that made two runs, and the cancelled duplicate showed up as a red X on the PR.

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR replaces the run still going on the older commit.
concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04, where the Playwright
# version in client/package.json can't install its browsers.
#
# How much of the browser suite runs depends on what the PR changes
# (.github/scripts/change-scope.py has the file list):
#   site-only (marketing pages, their images and copy, icons, docs): the browser jobs only open
#     the site pages (site.spec.js) in Chromium and Safari. Roughly 5 to 10 minutes.
#   anything else: every browser game, in both browsers. About 30 minutes.
# Unit tests, build, page checks and the socket games always run. Running it by hand from the
# Actions tab always runs everything.
jobs:
  scope:
    name: Decide which browser tests this change needs
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
      specs: ${{ steps.scope.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look at the changed files
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 .github/scripts/change-scope.py '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'
          else
            python3 .github/scripts/change-scope.py --full
          fi

  unit:
    name: Server and client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run server tests
        run: |
          pip install -q -r server/requirements.txt pytest
          python -m pytest server/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps

      - name: Run client tests
        working-directory: ./client
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React app
        working-directory: ./client
        run: npm run build
        env:
          CI: false

      - name: Check production pages in browser
        working-directory: ./client
        run: node scripts/check-built-app.js

      - name: Check crawl access and page metadata
        working-directory: ./client
        run: node scripts/check-seo.js

      - name: Check Nginx page routing
        # apt hung for hours on 2026-10-31 (two runs stuck installing nginx); fail fast instead.
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python3 deploy/tests/check-seo-nginx.py

  socket-games:
    name: Server plays full games (sockets, 5 and 40 players)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          pip install -q -r server/requirements.txt
          cd client && npm ci --legacy-peer-deps
      - name: Play full games over sockets
        run: |
          (cd server && python app.py > ../server-out.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5001/health && break; sleep 1; done
          cd client
          node scripts/e2e-live.js http://127.0.0.1:5001
          node scripts/e2e-live.js http://127.0.0.1:5001 --players 40
      - name: Server log
        if: failure()
        run: tail -200 server-out.log

  browser:
    name: Browser games (${{ matrix.name }})
    needs: scope
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Every game in five shards, or only the site pages for a site-only change (see the scope job)
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          pip install -q -r server/requirements.txt
          cd client && npm ci --legacy-peer-deps
      - name: Install the test browser
        working-directory: ./client
        run: npx playwright install --with-deps ${{ matrix.project }}
      # Playwright starts the local Flask and React servers itself (see e2e/playwright.config.js).
      - name: Play games in real browsers
        working-directory: ./client
        run: npx playwright test -c e2e --project ${{ matrix.project }} --shard ${{ matrix.shard }} ${{ needs.scope.outputs.specs }}
        env:
          E2E_WEBKIT: ${{ matrix.project == 'webkit' && '1' || '' }}
      - name: List known bugs
        if: always()
        working-directory: ./client
        run: node scripts/e2e-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            client/e2e/report
            client/e2e/results
          if-no-files-found: ignore
