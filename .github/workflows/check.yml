name: Check a change

# Runs on every pull request, and on pushes to any branch but main (main has "Deploy to beta").
# Everything runs here in CI against a local server, so a change is tested before it's merged
# and before it reaches beta or prod.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# A push to a branch with an open PR starts this twice (push and pull_request); one run per
# branch is enough, so the later one replaces the earlier.
concurrency:
  group: check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04, where the Playwright
# version in client/package.json can't install its browsers.
jobs:
  unit:
    name: Server and client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run server tests
        run: |
          pip install -q -r server/requirements.txt pytest
          python -m pytest server/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps

      - name: Run client tests
        working-directory: ./client
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React app
        working-directory: ./client
        run: npm run build
        env:
          CI: false

      - name: Check production pages in browser
        working-directory: ./client
        run: node scripts/check-built-app.js

      - name: Check crawl access and page metadata
        working-directory: ./client
        run: node scripts/check-seo.js

      - name: Check Nginx page routing
        # apt hung for hours on 2026-10-31 (two runs stuck installing nginx); fail fast instead.
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python3 deploy/tests/check-seo-nginx.py

  socket-games:
    name: Server plays full games (sockets, 5 and 40 players)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          pip install -q -r server/requirements.txt
          cd client && npm ci --legacy-peer-deps
      - name: Play full games over sockets
        run: |
          (cd server && python app.py > ../server-out.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5001/health && break; sleep 1; done
          cd client
          node scripts/e2e-live.js http://127.0.0.1:5001
          node scripts/e2e-live.js http://127.0.0.1:5001 --players 40
      - name: Server log
        if: failure()
        run: tail -200 server-out.log

  browser:
    name: Browser games (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Safari 1/2', project: webkit, shard: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: |
          pip install -q -r server/requirements.txt
          cd client && npm ci --legacy-peer-deps
      - name: Install the test browser
        working-directory: ./client
        run: npx playwright install --with-deps ${{ matrix.project }}
      # Playwright starts the local Flask and React servers itself (see e2e/playwright.config.js).
      - name: Play games in real browsers
        working-directory: ./client
        run: npx playwright test -c e2e e2e/late-join.spec.js e2e/live-join.spec.js --project=${{ matrix.project }}
        env:
          E2E_WEBKIT: ${{ matrix.project == 'webkit' && '1' || '' }}
      - name: List known bugs
        if: always()
        working-directory: ./client
        run: node scripts/e2e-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            client/e2e/report
            client/e2e/results
          if-no-files-found: ignore
