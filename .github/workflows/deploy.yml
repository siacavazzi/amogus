name: Deploy to beta

# Pushes to main go to the beta copy of the app (/opt/amogus-beta, port 5002).
# Open https://susparty.com/?beta=1 to use it, ?beta=0 to go back to prod.
# The "Promote beta to prod" workflow copies what is on beta into prod.

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: droplet
  cancel-in-progress: false

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04, where the Playwright
# version in client/package.json can't install its browsers.
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Each deploy gets a version like 2026.10.17.42 (UTC build date + workflow
      # run number). The client build embeds it and the server reads version.json.
      - name: Stamp version
        run: |
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          COMMIT="$(git rev-parse --short HEAD)"
          printf '{"version": "%s", "commit": "%s", "built_at": "%s", "run_number": %s}\n' \
            "$VERSION" "$COMMIT" "$BUILT_AT" "${{ github.run_number }}" > server/version.json
          cat server/version.json
          {
            echo "REACT_APP_VERSION=$VERSION"
            echo "REACT_APP_COMMIT=$COMMIT"
            echo "REACT_APP_BUILT_AT=$BUILT_AT"
          } >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run server tests
        run: |
          pip install -q -r server/requirements.txt pytest
          python -m pytest server/tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps

      - name: Run client tests
        working-directory: ./client
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React app
        working-directory: ./client
        run: npm run build
        env:
          CI: false  # Don't treat warnings as errors

      - name: Check production pages in browser
        working-directory: ./client
        run: node scripts/check-built-app.js

      - name: Check crawl access and page metadata
        working-directory: ./client
        run: node scripts/check-seo.js

      - name: Check Nginx page routing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python3 deploy/tests/check-seo-nginx.py

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to beta on the Droplet
        run: |
          ssh root@${{ secrets.DROPLET_IP }} 'mkdir -p /opt/amogus-beta/server/selfies /opt/amogus-beta/server/data /opt/amogus-beta/server/task_lists /opt/amogus-beta/server/logs /opt/amogus-beta/client/build'

          # Upload server files
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'stats.json*' \
            --exclude 'selfies/*' \
            --exclude 'task_lists/*' \
            --exclude 'data/*' \
            --exclude 'logs/*' \
            --exclude 'cert.pem' \
            --exclude 'key.pem' \
            ./server/ root@${{ secrets.DROPLET_IP }}:/opt/amogus-beta/server/

          # Upload built React app
          rsync -avz --delete \
            ./client/build/ root@${{ secrets.DROPLET_IP }}:/opt/amogus-beta/client/build/

          # Deploy scripts go next to beta; promote copies them for prod
          rsync -avz --delete \
            ./deploy/ root@${{ secrets.DROPLET_IP }}:/opt/amogus-beta/deploy/

      # Nginx is shared by prod and beta, so its config is applied by "Promote beta to prod",
      # after the gate has passed, never straight from main.

      - name: Restart beta
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ADMIN_PASSWORD_B64="$(printf '%s' "$ADMIN_PASSWORD" | base64 -w 0)"
          ssh root@${{ secrets.DROPLET_IP }} "ADMIN_PASSWORD_B64='$ADMIN_PASSWORD_B64' bash -s" << 'EOF'
            set -e
            # The beta service is a copy of the prod unit pointed at /opt/amogus-beta
            # and port 5002. It shares prod's Python virtualenv.
            prod_unit="$(systemctl show -p FragmentPath --value amogus)"
            sed -e 's#/opt/amogus/server#/opt/amogus-beta/server#g' \
                -e 's#5001#5002#g' \
                -e 's#^Description=.*#Description=Sus Party Game Server (beta)#' \
                -e 's#/var/log/amogus/stdout.log#/var/log/amogus/stdout-beta.log#' \
                -e 's#/var/log/amogus/stderr.log#/var/log/amogus/stderr-beta.log#' \
                "$prod_unit" > /etc/systemd/system/amogus-beta.service
            install -d -m 0755 /etc/systemd/system/amogus-beta.service.d
            printf '[Service]\nEnvironment="AMOGUS_CHANNEL=beta"\n' > /etc/systemd/system/amogus-beta.service.d/channel.conf
            if [ -n "${ADMIN_PASSWORD_B64:-}" ]; then
              ADMIN_PASSWORD="$(printf '%s' "$ADMIN_PASSWORD_B64" | base64 -d)"
              for unit in amogus amogus-beta; do
                install -d -m 0755 /etc/systemd/system/$unit.service.d
                printf '[Service]\nEnvironment="ADMIN_PASSWORD=%s"\n' "$ADMIN_PASSWORD" > /etc/systemd/system/$unit.service.d/admin-password.conf
              done
            fi
            # Match the prod unit's run-as user, if it has one
            owner="$(sed -n 's/^User=//p' "$prod_unit" | head -1)"
            if [ -n "$owner" ] && [ "$owner" != root ]; then
              chown -R "$owner" /opt/amogus-beta/server/selfies /opt/amogus-beta/server/data /opt/amogus-beta/server/task_lists /opt/amogus-beta/server/logs
            fi
            systemctl daemon-reload
            systemctl enable amogus-beta
            # Beta shares prod's virtualenv. This only adds packages that are missing, never upgrades
            # ones prod is using.
            /opt/amogus/venv/bin/pip install -q -r /opt/amogus-beta/server/requirements.txt soco
            systemctl restart amogus-beta
            sleep 3
            systemctl status amogus-beta --no-pager || true
          EOF

      - name: Health check
        run: |
          sleep 5
          curl --fail --retry 3 --cookie 'sus_channel=beta' https://susparty.com/health
          echo
          echo "Beta version: $(curl -s --cookie 'sus_channel=beta' https://susparty.com/api/version)"
          echo "Prod version: $(curl -s https://susparty.com/api/version)"

      # Scripted phones play whole games on beta over the real WebSocket: 5 players (join, tasks,
      # both intruder cards, a reconnect, a meeting and vote, the win, two last stands), then 40.
      # Their rooms are marked synthetic, so they stay out of usage stats.
      - name: Check the server plays a full game (sockets only, no browser)
        working-directory: ./client
        run: |
          node scripts/e2e-live.js https://susparty.com --beta --browser --expect-commit "$REACT_APP_COMMIT"
          node scripts/e2e-live.js https://susparty.com --beta --players 40 --expect-commit "$REACT_APP_COMMIT"

  # Real browser pages for the reactor and the phones play whole games on beta, split across
  # parallel jobs. Each test makes its own room, so they don't get in each other's way.
  browser:
    name: Browser games on beta (${{ matrix.name }})
    needs: build-and-deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Chromium 1/3', project: chromium, shard: '1/3' }
          - { name: 'Chromium 2/3', project: chromium, shard: '2/3' }
          - { name: 'Chromium 3/3', project: chromium, shard: '3/3' }
          - { name: 'Safari 1/2', project: webkit, shard: '1/2' }
          - { name: 'Safari 2/2', project: webkit, shard: '2/2' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps
      - name: Install the test browser
        working-directory: ./client
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Play games in real browsers on beta
        working-directory: ./client
        run: npx playwright test -c e2e --project ${{ matrix.project }} --shard ${{ matrix.shard }}
        env:
          E2E_BASE_URL: https://susparty.com
          E2E_BETA: '1'
          E2E_WEBKIT: ${{ matrix.project == 'webkit' && '1' || '' }}
      - name: List known bugs
        if: always()
        working-directory: ./client
        run: node scripts/e2e-summary.js >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            client/e2e/report
            client/e2e/results
          if-no-files-found: ignore
