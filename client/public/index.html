<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Primary meta -->
    <title>Sus Party | Not Another Couch Party Game</title>
    <meta
      name="description"
      content="Sus Party is a free phone-guided social deduction game for house parties. Move room to room, complete real tasks, survive sabotage, call meetings, and find the secret saboteur."
    />
    <meta name="author" content="Sus Party" />
    <link rel="canonical" href="https://susparty.com/" />

    <!-- Open Graph (Facebook, iMessage, Discord, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sus Party" />
    <meta property="og:url" content="https://susparty.com/" />
    <meta property="og:title" content="Sus Party | Not Another Couch Party Game" />
    <meta property="og:description" content="A free phone-guided social deduction game where your house becomes the board. Move room to room, complete tasks, survive sabotage, call meetings, and vote." />
    <meta property="og:image" content="https://susparty.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sus Party, a real-life social deduction party game" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sus Party | Not Another Couch Party Game" />
    <meta name="twitter:description" content="Your house becomes the board. Phones guide the chaos, but everyone moves room to room for tasks, sabotage, meetings, and votes." />
    <meta name="twitter:image" content="https://susparty.com/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "Sus Party",
        "description": "A free phone-guided social deduction party game where players move through a real house, complete tasks, trigger sabotage, call meetings, and vote out the secret saboteur.",
        "url": "https://susparty.com/",
        "image": "https://susparty.com/og-image.jpg",
        "genre": ["Party Game", "Social Deduction"],
        "numberOfPlayers": {
          "@type": "QuantitativeValue",
          "minValue": 5,
          "maxValue": 15
        },
        "applicationCategory": "Game",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
