<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Primary meta -->
    <title>Sus Party | Free Among Us IRL Game for 3 to 20+ Players</title>
    <meta
      name="description"
      content="Play Among Us in real life, free in your phone browser. Real tasks, secret roles, meetings and votes for 3 to 20+ players at parties, youth groups and classes."
    />
    <meta name="author" content="Sus Party" />
    <link rel="canonical" href="https://susparty.com/" />

    <!-- Open Graph (Facebook, iMessage, Discord, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sus Party" />
    <meta property="og:url" content="https://susparty.com/" />
    <meta property="og:title" content="Sus Party | Free Among Us IRL Game for 3 to 20+ Players" />
    <meta property="og:description" content="Play Among Us in real life, free in your phone browser. Real tasks, secret roles, meetings and votes for 3 to 20+ players at parties, youth groups and classes." />
    <meta property="og:image" content="https://susparty.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sus Party, a free Among Us-inspired party game for real-life play" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sus Party | Free Among Us IRL Game for 3 to 20+ Players" />
    <meta name="twitter:description" content="Play Among Us in real life, free in your phone browser. Real tasks, secret roles, meetings and votes for 3 to 20+ players at parties, youth groups and classes." />
    <meta name="twitter:image" content="https://susparty.com/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "Sus Party",
        "description": "A free, independent Among Us-inspired party game for real-life play. Phones guide tasks, secret roles, sabotage, meetings, and votes around your house.",
        "url": "https://susparty.com/",
        "image": "https://susparty.com/og-image.jpg",
        "genre": ["Party Game", "Social Deduction"],
        "numberOfPlayers": {
          "@type": "QuantitativeValue",
          "minValue": 3,
          "maxValue": 30
        },
        "applicationCategory": "Game",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Sus Party.</noscript>
    <div id="root"></div>
  </body>
</html>
