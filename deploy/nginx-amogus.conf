# Nginx configuration for Sus Party game
# Place this file in /etc/nginx/sites-available/amogus
# Then symlink: sudo ln -s /etc/nginx/sites-available/amogus /etc/nginx/sites-enabled/

# Beta channel: main deploys to a beta copy of the app (port 5002,
# /opt/amogus-beta). Visiting any page with ?beta=1 sets a cookie that routes
# that browser to beta; ?beta=0 clears it. Everyone else gets prod.

# Read the opt-in from $request_uri: it keeps the query string after the
# internal redirect to /index.html, which $arg_beta does not.
map $request_uri $beta_param {
    "~[?&]beta=1(&|$)"  1;
    "~[?&]beta=0(&|$)"  0;
    default             "";
}

map $beta_param $beta_cookie {
    "1"     "sus_channel=beta; Path=/; Max-Age=2592000; Secure; SameSite=Lax";
    "0"     "sus_channel=; Path=/; Max-Age=0; Secure; SameSite=Lax";
    default "";
}

map "$beta_param:$cookie_sus_channel" $sus_channel {
    "~^1:"     beta;
    "~^0:"     prod;
    "~:beta$"  beta;
    default    prod;
}

map $sus_channel $sus_backend {
    beta    127.0.0.1:5002;
    default 127.0.0.1:5001;
}

map $sus_channel $sus_root {
    beta    /opt/amogus-beta/client/build;
    default /opt/amogus/client/build;
}

map $sus_channel $sus_robots {
    beta    "noindex";
    default "";
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name susparty.com www.susparty.com;
    
    # For Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://susparty.com$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name susparty.com www.susparty.com;

    if ($host = www.susparty.com) {
        return 301 https://susparty.com$request_uri;
    }

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/susparty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/susparty.com/privkey.pem;
    
    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (optional, uncomment when confirmed working)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/amogus_access.log;
    error_log /var/log/nginx/amogus_error.log;

    # Client body size (for selfie uploads)
    client_max_body_size 10M;

    # Beta opt-in/out cookie and keep beta pages out of search (both empty for prod)
    add_header Set-Cookie $beta_cookie;
    add_header X-Robots-Tag $sus_robots;
    add_header Vary Cookie;

    # Compress text files. The system nginx.conf only compresses HTML, so the
    # 1.7 MB JavaScript bundle went out uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml;

    # Serve static files (React build) for this browser's channel
    root $sus_root;
    index index.html;

    # Serve page snapshots before directories to avoid automatic slash redirects.
    # One URL per page: /among-us-irl/ redirects to /among-us-irl so search
    # engines stop counting the two as separate pages. Query strings are kept.
    # Build files carry a content hash in their names, so browsers can keep them
    # for a year. A missing file is a real 404 instead of the app shell.
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Old page URL that AI answers still link to.
    location = /how-to-play.html {
        return 301 /how-to-play$is_args$args;
    }

    # Pages merged into a stronger page on the same topic (Nov 2026).
    location = /among-us-party-game {
        return 301 /among-us-birthday-party$is_args$args;
    }
    location = /make-cleaning-fun-for-kids {
        return 301 /among-us-chores$is_args$args;
    }
    location = /chore-game-app {
        return 301 /among-us-chores$is_args$args;
    }

    location / {
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri/index.html $uri /index.html;
    }

    # API endpoints - proxy to Flask
    location /api/ {
        proxy_pass http://$sus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Selfies endpoint - proxy to Flask
    location /selfies/ {
        proxy_pass http://$sus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Photo URLs contain temporary connection credentials.
        access_log off;
        proxy_cache off;
        expires off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # Socket.IO - requires special handling for WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://$sus_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Disable buffering for real-time
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://$sus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
